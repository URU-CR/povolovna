<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Povolovna – nahrání dokumentace</title>
<style>
@font-face{font-family:Roboto;font-weight:400;font-style:normal;font-display:swap;src:url("vendor/fonts/roboto-regular-ext.woff2") format("woff2");unicode-range:U+0100-024F,U+0259,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Roboto;font-weight:400;font-style:normal;font-display:swap;src:url("vendor/fonts/roboto-regular.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Roboto;font-weight:500;font-style:normal;font-display:swap;src:url("vendor/fonts/roboto-medium-ext.woff2") format("woff2");unicode-range:U+0100-024F,U+0259,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Roboto;font-weight:500;font-style:normal;font-display:swap;src:url("vendor/fonts/roboto-medium.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Roboto;font-weight:700;font-style:normal;font-display:swap;src:url("vendor/fonts/roboto-bold-ext.woff2") format("woff2");unicode-range:U+0100-024F,U+0259,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Roboto;font-weight:700;font-style:normal;font-display:swap;src:url("vendor/fonts/roboto-bold.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* GOV.CZ Design System 4.7.3: barvy z palety primary/neutral/success/warning/error, písmo Roboto, zaoblení 8 px */
  --bg:#ffffff; --surface:#ffffff; --sunk:#f2f6fc; --ink:#262626; --muted:#5d5d5d; --line:#d1d1d1;
  --brand:#00469b; --brand-hover:#0e3578; --brand-ink:#ffffff; --accent:#00469b; --accent-ink:#ffffff; --hl:#fab413; --focus:#007bff;
  --ok:#2a6b2d; --ok-bg:#e2f6e3; --warn:#6b4a0d; --warn-bg:#fef7c3; --bad:#b50817; --bad-bg:#fae3de; --info:#0e3578; --info-bg:#e2eef8;
  --display:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:Roboto,system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#04060e; --surface:#091129; --sunk:#0c1838; --ink:#f6f6f6; --muted:#b0b0b0; --line:#102657;
    --brand:#9ec8e9; --brand-hover:#cee3f4; --brand-ink:#060b1b; --accent:#9ec8e9; --accent-ink:#060b1b; --hl:#fbc342; --focus:#6caef4;
    --ok:#9bda9e; --ok-bg:#0d260f; --warn:#fdd835; --warn-bg:#432e06; --bad:#f29c97; --bad-bg:#4a031a; --info:#cee3f4; --info-bg:#102657;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bg:#04060e; --surface:#091129; --sunk:#0c1838; --ink:#f6f6f6; --muted:#b0b0b0; --line:#102657;
    --brand:#9ec8e9; --brand-hover:#cee3f4; --brand-ink:#060b1b; --accent:#9ec8e9; --accent-ink:#060b1b; --hl:#fbc342; --focus:#6caef4;
    --ok:#9bda9e; --ok-bg:#0d260f; --warn:#fdd835; --warn-bg:#432e06; --bad:#f29c97; --bad-bg:#4a031a; --info:#cee3f4; --info-bg:#102657;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4vw,40px);font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:var(--brand)}
.card h3,.card h2{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.logo{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:4px;background:var(--brand);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:6px;top:5px;width:6px;height:10px;border:solid var(--brand-ink);border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
.seg.law button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.spacer{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.demo-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:3px 10px}

/* bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:8px;min-height:40px;padding:8px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover,.btn.brand:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.big{min-height:48px;padding:10px 24px;font-size:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.idle{background:var(--sunk);color:var(--muted)}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--sunk);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* stepper */
.steps{display:flex;gap:6px;list-style:none;margin:0 0 22px;padding:0;flex-wrap:wrap}
.steps li{flex:1 1 130px;border-top:4px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted);font-weight:500}
.steps li b{display:block;font-family:var(--mono);font-size:11.5px;font-weight:500}
.steps li.done{border-color:var(--brand);color:var(--ink)}
.steps li.now{border-color:var(--hl);color:var(--ink);font-weight:600}

/* catalog */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:26px}
@media (max-width:800px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p{max-width:56ch;color:var(--muted);margin-top:10px;font-size:16px}
.how{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.how span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.how span b{font-family:var(--mono);color:var(--brand);font-weight:700;margin-right:6px;font-weight:500}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prod{display:flex;flex-direction:column;gap:8px;min-height:190px}
.prod.live{border:2px solid var(--brand)}
.prod .price{font-family:var(--display);font-size:22px;font-weight:700;margin-top:auto}
.prod.soon{opacity:.72}

/* upload */
.drop{border:2px dashed var(--brand);border-radius:8px;padding:38px 20px;text-align:center;background:var(--surface)}
.drop.over{border-style:solid;background:var(--sunk)}
.scan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.scan li{display:flex;gap:10px;align-items:baseline;color:var(--muted)}
.scan li .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none;transform:translateY(1px)}
.scan li.run{color:var(--ink);font-weight:500}
.scan li.run .dot{border-color:var(--brand);border-top-color:transparent;animation:spin .7s linear infinite}
.scan li.done{color:var(--ink)}
.scan li.done .dot{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:translateY(1px) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.scan li.run .dot{animation:none}}

/* review */
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.issue{border-left:4px solid var(--bad);background:var(--bad-bg);border-radius:4px;padding:14px 16px}
.issue.fixed{border-color:var(--ok);background:var(--ok-bg)}
.issue.soft{border-color:var(--warn);background:var(--warn-bg)}
.cart{position:sticky;top:76px}
.cart .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.cart .tot b{font-family:var(--display);font-size:26px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
input[type=date],input[type=email],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;background:var(--surface)}
.pay label:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.pay input{margin-top:4px;accent-color:var(--brand)}

/* tracking */
.track{list-style:none;margin:0;padding:0}
.track li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;padding:0 0 18px;position:relative}
.track li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1}
.track li.done .b{background:var(--ok);border-color:var(--ok)}
.track li.done::before{background:var(--ok)}
.track li.now .b{border-color:var(--brand);box-shadow:0 0 0 4px var(--info-bg)}
.track li.todo{color:var(--muted)}
.track .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.track .who{font-size:12px;color:var(--muted)}

/* office */
.office{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.office{grid-template-columns:minmax(0,1fr)}}
.q{display:flex;flex-direction:column;gap:8px}
.q button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:5px}
.q button[aria-current="true"]{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand);background:var(--sunk)}
.q button.fake{opacity:.6;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.doc{font-size:14px;line-height:1.55;border:1px solid var(--line);border-radius:6px;padding:26px clamp(16px,4vw,44px);background:var(--surface);max-width:760px}
.doc h4{font-family:var(--body);text-align:center;letter-spacing:.2em;margin:18px 0 6px;font-size:15px}
.doc p{margin:0 0 10px}
.doc ol,.doc ul{margin:0 0 10px;padding-left:22px}
.gen{background:var(--info-bg);border-radius:3px;padding:0 2px}
.approve{border:2px solid var(--brand);border-radius:var(--r);padding:16px;background:var(--surface)}

/* concept */
.prose{max-width:70ch}
.prose p{margin-bottom:12px}
.bars{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bars div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:#fff;min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;font-size:13.5px;margin-top:12px}
.legend span{display:flex;gap:8px;align-items:baseline}
.legend b{white-space:nowrap}
.legend i{width:11px;height:11px;border-radius:3px;flex:none;transform:translateY(1px)}
.lvl{font-family:var(--mono);font-size:11.5px;border-radius:4px;padding:1px 6px;font-weight:500;white-space:nowrap}
.lvl.a{background:var(--ok-bg);color:var(--ok)} .lvl.b{background:var(--warn-bg);color:var(--warn)} .lvl.c{background:var(--bad-bg);color:var(--bad)}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.arch .card{padding:14px}
.arch ul{margin:8px 0 0;padding-left:18px;font-size:14px}
pre{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:12px;overflow-x:auto;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.find li{display:flex;gap:10px;align-items:baseline}
.up2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.upt{display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;padding:26px 18px}
.upt b{font-size:18px}
.blk{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:14px 16px;background:var(--surface)}
.blk.st-blokuje{border-left-color:var(--bad)}.blk.st-upozorneni{border-left-color:var(--hl)}.blk.st-neprovedeno{border-left-color:var(--line)}
.blk>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary .bt{font-family:var(--display);font-weight:700;font-size:18px}
.blk>summary .bt::before{content:"▸";display:inline-block;width:20px;color:var(--brand)}
.blk[open]>summary .bt::before{content:"▾"}
.find{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.find li{display:flex;gap:10px;align-items:baseline}
details.inner{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.inner summary{cursor:pointer;font-weight:700}
</style>
</head>
<body data-page="podani">
<header class="top">
  <div class="top-in">
    <div class="logo"><i></i>Povolovna</div>
    <a href="./" class="small">← Prototyp a koncept</a>
    <div class="spacer"></div>
    <div class="auth" id="auth"></div>
  </div>
</header>
<main class="wrap stack" style="gap:20px">
  <div>
    <h1>Nahrajte dokumentaci a přílohy</h1>
    <p class="muted" style="max-width:68ch;margin-top:8px">Vyberte dokumentaci a přílohy, pak vše vytěžíme naráz. Po přihlášení lze uložit vytěžené údaje, otisky souborů a výsledky kontrol.</p>
  </div>
  <div id="upbox"></div>
  <div id="progress" class="card" hidden></div>
  <div class="row" id="again" hidden><button class="btn" id="newup">Nahrát jiné soubory</button></div>
  <div id="out" class="stack" style="gap:16px"></div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/spark-md5.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/ocr/tesseract.min.js"></script>
<script src="podani.js"></script>
<script>
Povolovna.onRestore = Povolovna.onDone = () => { document.getElementById("again").hidden = false; };
document.getElementById("newup").addEventListener("click", () => { Povolovna.reset(); location.reload(); });
</script>

</body>
</html>
